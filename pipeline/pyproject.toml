[project]
name = "notetaker"
version = "0.1.0"
description = "Local meeting transcription (Whisper/MLX) + summaries (Claude or local LLM)"
requires-python = ">=3.11,<3.13"
dependencies = [
    "mlx-whisper>=0.4.2",
    "mlx-lm>=0.24",
    "numpy",
    "soundfile",
    "scipy",
]

[project.scripts]
notetaker = "notetaker.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
